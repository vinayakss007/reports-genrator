version: "3.9"

services:
  api:
    build:
      context: .
      target: api
    ports:
      - "${API_PORT:-3001}:3001"
    volumes:
      - data:/data
    env_file:
      - .env.production
    environment:
      - DATA_DIR=/data
      - NODE_ENV=production
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3001/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  web:
    build:
      context: .
      target: web
    ports:
      - "${WEB_PORT:-80}:80"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  data:
    driver: local
